# 贡献者许可协议（CLA）检查：第一次提 PR 的贡献者需要在 PR 里回复一句话签署 CLA.md
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: ZihanDaiii,bot*
          custom-notsigned-prcomment: '感谢你的贡献！合并前需要你签署[贡献者许可协议（CLA）](https://github.com/${{ github.repository }}/blob/main/CLA.md)。阅读后在本 PR 下回复下面这句话即可（只需签一次）：'
          custom-allsigned-prcomment: '所有贡献者都已签署 CLA，感谢！'
